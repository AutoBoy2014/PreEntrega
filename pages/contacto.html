<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&family=Poppins:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto | Tienda</title>
  </head>
  <body>
    <header>
      <div class="div-logo"><a class="logo" href="../index.html"><img class="logo-imagen" src="../img/Logo.png" alt="" />La Tienda De Auto</a></div>
      <nav class="header-nav" aria-label="Navegación principal">
        <ul>
          <li class="text-secondary"><a href="../index.html">Inicio</a></li>
          <li class="text-secondary"><a href="./contacto.html" aria-current="page">Contacto</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contacto">
        <h1 class="titulo-contacto text-secondary">Contactanos</h1>
        <form class="form-contacto" action="#" method="get">
          <div class="grupo-input text-secondary">
            <label for="email">Tu correo electrónico</label>
            <input id="email" type="email" name="email" autocomplete="email" required />
          </div>
          <div class="grupo-input text-secondary">
            <label for="mensaje">Tu mensaje</label>
            <textarea id="mensaje" name="message" required></textarea>
          </div>
          <button class="btn bg-secondary text-secondary" type="submit">Enviar</button>
        </form>
      </section>
    </main>
    <footer>
      <p>Sitio realizado por Belu para Talento Tech</p>
      <nav aria-label="Redes sociales">
        <ul class="footer-list">
          <li><a href="https://x.com/Auto_Boy_3024" aria-label="X"><img src="../img/X_logo.png" alt="X" /></a></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
